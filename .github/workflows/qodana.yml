name: "Qodana - Static Code Analysis"

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  qodana:
    name: "JetBrains Qodana Code Inspection"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Qodana Scan
        uses: JetBrains/qodana-action@v2024.2
        continue-on-error: true
        with:
          use-annotations: true
          upload-result: false

      - name: Archive Qodana Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qodana-report
          path: ${{ runner.temp }}/qodana/results

