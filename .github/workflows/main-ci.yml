name: "VGA Store - CI Pipeline"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================================
  # JOB 1: Backend Build & Unit Testing (Spring Boot)
  # ==========================================================
  backend-ci:
    name: "Backend CI (Java 17, Spring Boot, Unit Tests)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build & Run Unit Tests with Maven
        working-directory: ./backend/vgashop
        run: |
          chmod +x mvnw
          ./mvnw clean test

      - name: Package Backend Artifact
        working-directory: ./backend/vgashop
        run: |
          ./mvnw package -DskipTests

      - name: Upload Test Report (Surefire)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-surefire-reports
          path: backend/vgashop/target/surefire-reports/

  # ==========================================================
  # JOB 2: Frontend User Build & Lint (React 18 + Vite)
  # ==========================================================
  frontend-user-ci:
    name: "Frontend User CI (React 18, Vite)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fontend/user/package-lock.json

      - name: Install Dependencies
        working-directory: ./fontend/user
        run: npm install

      - name: Run Linter
        working-directory: ./fontend/user
        run: npm run lint || true

      - name: Build User Frontend
        working-directory: ./fontend/user
        run: npm run build

  # ==========================================================
  # JOB 3: Frontend Admin Build & Lint (React 18 + Vite)
  # ==========================================================
  frontend-admin-ci:
    name: "Frontend Admin CI (React 18, Vite)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fontend/admin/package-lock.json

      - name: Install Dependencies
        working-directory: ./fontend/admin
        run: npm install

      - name: Run Linter
        working-directory: ./fontend/admin
        run: npm run lint || true

      - name: Build Admin Frontend
        working-directory: ./fontend/admin
        run: npm run build
