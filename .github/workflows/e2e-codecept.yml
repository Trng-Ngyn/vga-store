name: CodeceptJS - E2E Acceptance Testing

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master, 'khoi/kan-12-14-e2e']

permissions:
  contents: read

jobs:
  catalog-e2e:
    name: Test catalog with Spring Boot and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            e2e-tests/package-lock.json
            fontend/user/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install E2E dependencies and Chromium
        working-directory: e2e-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build customer frontend
        working-directory: fontend/user
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build backend
        working-directory: backend/vgashop
        run: mvn -B package -DskipTests

      - name: Start PostgreSQL
        run: >
          docker run --detach --name catalog-postgres
          --publish 127.0.0.1:5433:5432
          --env POSTGRES_USER=postgres
          --env POSTGRES_PASSWORD=3007
          --env POSTGRES_DB=vga_store
          postgres:17-alpine

      - name: Load repository schema and seed data
        run: |
          if ! timeout 60s bash -c 'until docker exec catalog-postgres pg_isready -h 127.0.0.1 -U postgres -d vga_store; do sleep 2; done'; then
            docker logs catalog-postgres
            exit 1
          fi
          for sql in database/create_tables.sql database/seed_vga.sql; do
            echo "Loading $sql"
            docker exec -i catalog-postgres psql -X --quiet --set=ON_ERROR_STOP=1 --username=postgres --dbname=vga_store < "$sql"
          done

      - name: Start backend and customer frontend
        env:
          SPRING_PROFILES_ACTIVE: prod
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/vga_store
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: '3007'
        run: |
          mkdir -p e2e-tests/output
          java -jar backend/vgashop/target/vgashop-0.0.1-SNAPSHOT.jar > e2e-tests/output/backend.log 2>&1 &
          npm --prefix fontend/user run preview -- --host 127.0.0.1 --port 5173 --strictPort > e2e-tests/output/frontend.log 2>&1 &
          timeout 90s bash -c 'until curl -fsS "$BASE_URL" > /dev/null && curl -fsS "http://localhost:8080/api/products?size=100" | jq -e ".data.content | any(.name | test(\"RTX\"; \"i\"))" > /dev/null; do sleep 2; done'

      - name: Run catalog acceptance tests
        working-directory: e2e-tests
        run: npm run test:headless -- --grep '@catalog'

      - name: Save test evidence and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codecept-catalog-output
          path: e2e-tests/output/
          if-no-files-found: ignore
