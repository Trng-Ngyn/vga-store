spring.application.name=vgashop-test

# In-Memory Database for Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# File upload
app.upload.dir=uploads/products
spring.mvc.static-path-pattern=/uploads/**

# JWT Secrets
app.jwt.secret=VGAStore2024SecretKeyForJWTTokenGenerationMustBe256BitsLong!
app.jwt.expiration=86400000
jwt.secret=vga-shop-secret-key-2026-very-strong-and-long-enough-for-hmac

# Spring Security
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# URLs
app.frontend.url=http://localhost:5173
app.backend.url=http://localhost:8080
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174

